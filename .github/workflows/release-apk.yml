# Builds the release APK and attaches it to a GitHub release.
#
# Why this exists: the in-app update checker downloads the APK asset from
# the GitHub release. Sandbox credentials cannot upload release assets
# (uploads.github.com is not reachable with the available auth), so the
# build + attach happens here in Actions, where GITHUB_TOKEN can do it.
#
# Trigger: Actions tab -> "Build and release APK" -> Run workflow,
# or via API: POST /repos/{owner}/{repo}/actions/workflows/release-apk.yml/dispatches
# with {"ref": "master", "inputs": {"tag": "v1.1.2+4"}}.
name: Build and release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.1.2+4 (must match the pubspec version)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - run: flutter pub get
      # gen-l10n must run before analyze: the AppLocalizations classes are
      # generated (into .dart_tool, git-ignored) and analyze needs them.
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Create GitHub release with APK
        run: |
          APK="maliki-prayer-times-${{ inputs.tag }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          sha256sum "$APK"
          gh release create "${{ inputs.tag }}" "$APK" \
            --title "${{ inputs.tag }}" \
            --notes "Maliki Prayer Times ${{ inputs.tag }} (test build, test-signed)."
        env:
          GH_TOKEN: ${{ github.token }}
