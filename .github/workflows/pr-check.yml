# Continuous checks: analyze + tests on every push and pull request.
name: PR check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'

      - run: flutter pub get
      # AppLocalizations are generated (git-ignored); analyze needs them.
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
